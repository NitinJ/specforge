        <text x="268" y="146" class="svg-lbl-m">Judged on every spec of type research.</text>
        <text x="268" y="172" class="svg-lbl-m">WHAT MUST BE TRUE</text>
        <rect x="268" y="182" width="428" height="48" rx="8" class="svg-box"/>
        <text x="282" y="206" class="svg-lbl-m">No vendor quotes outside a research doc.▎</text>
