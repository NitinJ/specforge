        <rect x="24" y="104" width="228" height="220" rx="8" class="svg-box"/>
        <text x="38" y="124" class="svg-lbl-m">SHIPPED FOR THIS TYPE</text>
        <text x="38" y="148" class="svg-lbl-m">findings-cite-sources</text>
        <text x="38" y="170" class="svg-lbl-m">method-states-scope</text>
