        <text x="38" y="216" class="svg-lbl-m">CUSTOM</text>
        <rect x="30" y="226" width="216" height="26" rx="6" class="svg-box-a"/>
        <text x="38" y="244" class="svg-lbl">no-vendor-quotes</text><circle cx="238" cy="239" r="4" class="svg-box-a"/>
        <text x="38" y="284" class="svg-lbl">+ New rule</text>
        <text x="268" y="124" class="svg-lbl">no-vendor-quotes</text>
