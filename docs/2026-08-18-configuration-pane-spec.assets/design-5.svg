        <text x="528" y="44" class="svg-lbl-m">Reset Rules to shipped ⟲</text>
        <rect x="96" y="66" width="76" height="24" rx="12" class="svg-box-a"/><text x="106" y="82" class="svg-lbl">research</text>
        <rect x="24" y="66" width="66" height="24" rx="12" class="svg-box"/><text x="34" y="82" class="svg-lbl-m">design</text>
