<!DOCTYPE html>
<html lang="en" data-theme="light" data-sf-spec-status="draft" data-sf-components="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Spec</title>
<style>
/* specforge:components v1 start: generated by components build, do not edit */

.callout{position:relative;border-left:3px solid var(--accent);background:var(--panel);
  border-radius:0 10px 10px 0;padding:12px 16px;margin:16px 0}
.callout::before{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.callout > :first-of-type{margin-top:0}
.callout > :last-child{margin-bottom:0}

/* heading */
h2{position:relative;font-size:25px;font-weight:650;letter-spacing:-.01em;
  margin:56px 0 14px;padding-top:12px;border-top:1px solid var(--line)}
h2::before{content:"";position:absolute;top:-1px;left:0;width:46px;height:2px;background:var(--accent)}
main > section:first-of-type > h2,main > h2:first-of-type{border-top:none;margin-top:18px}
main > section:first-of-type > h2::before,main > h2:first-of-type::before{display:none}
h3{font-size:19.5px;font-weight:650;margin:34px 0 8px;color:var(--accent)}
h4{font-size:16.5px;margin:24px 0 6px;font-weight:700}
h5{font-size:12.5px;margin:22px 0 6px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.09em;font-weight:700}
/* notice */
.callout.note::before{content:"Note"}
.callout.tip{border-left-color:var(--green)}
.callout.tip::before{color:var(--green)}
.callout.tip::before{content:"Tip"}
.callout.success{border-left-color:var(--green)}
.callout.success::before{color:var(--green)}
.callout.success::before{content:"Success"}
.callout.warning{border-left-color:var(--amber);background:color-mix(in srgb,var(--amber) 7%,var(--panel))}
.callout.warning::before{color:var(--amber)}
.callout.warning::before{content:"Warning"}
.callout.danger{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.callout.danger::before{color:var(--red)}
.callout.danger::before{content:"Danger"}
.callout.example::before{content:"Example"}
.callout.quote::before{content:"Quote"}
.callout.quote{border-left-style:double;border-left-width:6px}
.callout.quote p{font-style:italic}
.callout.decision::before{content:"Decision"}
.callout.decision{background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.callout.assumption{border-left-color:var(--amber);background:color-mix(in srgb,var(--amber) 7%,var(--panel))}
.callout.assumption::before{color:var(--amber)}
.callout.assumption::before{content:"Assumption"}
.callout.risk{border-left-color:var(--amber);background:color-mix(in srgb,var(--amber) 7%,var(--panel))}
.callout.risk::before{color:var(--amber)}
.callout.risk::before{content:"Risk"}
.callout.deviation{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.callout.deviation::before{color:var(--red)}
.callout.deviation::before{content:"Deviation"}
.callout.constraint::before{content:"Constraint"}
.callout.constraint{border-left-style:dashed}
/* inline */
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);vertical-align:middle;line-height:1.5}
.tag.accent{color:var(--accent)}
.tag.good{color:var(--green)}
.tag.warn{color:var(--amber)}
.tag.bad{color:var(--red)}
.tag.todo{color:var(--muted)}
.tag.done{color:var(--green)}
.kw{font-family:var(--mono);font-size:.82em;font-weight:700;letter-spacing:.04em;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-radius:4px;padding:.1em .4em;white-space:nowrap}
.term{border-bottom:1px dashed var(--muted);cursor:help}
.footnote{color:var(--muted);font-size:12.5px}
.src{color:var(--muted);font-size:12px;white-space:nowrap}
.src::before{content:"source: "}
/* data */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
th,td{text-align:left;padding:9px 12px;border:1px solid var(--line);vertical-align:top}
th{background:color-mix(in srgb,var(--accent) 12%,var(--panel2));font-weight:650;
  border-bottom:2px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
.compare td:last-child{white-space:nowrap}
table.sortable th{cursor:pointer;user-select:none;white-space:nowrap}
table.sortable th::after{content:"";display:inline-block;width:0;height:0;margin-left:7px;
  vertical-align:middle;opacity:.35;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid currentColor}
table.sortable th[aria-sort="ascending"]::after{opacity:1;
  border-top:none;border-bottom:5px solid currentColor}
table.sortable th[aria-sort="descending"]::after{opacity:1}
table.sortable th:hover{color:var(--accent)}
table.sortable th:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
.stat{flex:1 1 150px;background:color-mix(in srgb,var(--accent) 5%,var(--panel2));
  border:1px solid var(--line);border-top:2px solid var(--accent);
  border-radius:10px;padding:12px 14px}
.stat .n{display:block;font-size:22px;font-weight:700;line-height:1.2;color:var(--accent)}
.stat .k{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
dl{margin:14px 0}
dl dt{font-weight:650;margin-top:10px;color:var(--accent)}
dl dd{margin:2px 0 0 0;padding-left:14px;color:var(--muted);
  border-left:2px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
/* code */
.codeblock{margin:14px 0;position:relative}
.codeblock .filename{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  background:var(--panel2);border:1px solid var(--line);border-bottom:none;
  border-radius:8px 8px 0 0;padding:5px 12px}
.codeblock .filename + pre{border-radius:0 0 8px 8px;margin:0}
.diff{font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--code);
  border:1px solid var(--line);border-radius:8px;padding:10px 0;margin:14px 0;overflow:auto}
.diff .add,.diff .del,.diff .ctx{display:block;padding:0 14px;white-space:pre}
.diff .add{background:color-mix(in srgb,var(--green) 15%,transparent)}
.diff .del{background:color-mix(in srgb,var(--red) 15%,transparent)}
.diff .ctx{color:var(--muted)}
.copy{position:absolute;top:6px;right:8px;z-index:1;
  font:600 11px var(--mono);letter-spacing:.02em;
  color:var(--muted);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:3px 9px;cursor:pointer;opacity:0;transition:opacity .12s ease}
/* :focus, not :focus-visible, for the reveal. A control that is invisible while
   focused is broken however the focus arrived, and :focus-visible deliberately
   does not match programmatic focus. The ring below stays on :focus-visible,
   which is what that selector is for. */
.codeblock:hover .copy,.copy:focus{opacity:1}
.copy:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.copy:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.copy.copied{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--line));opacity:1}
@media (hover:none){.copy{opacity:1}}
@media print{[data-sf-live] .copy{display:none}}
/* structure */
details.disclosure{border:1px solid var(--line);border-radius:10px;
  background:var(--panel);margin:16px 0}
details.disclosure > summary{cursor:pointer;padding:11px 16px;font-weight:650;
  color:var(--accent);list-style:none;display:flex;align-items:center;gap:9px}
details.disclosure > summary::-webkit-details-marker{display:none}
details.disclosure > summary::before{content:"";flex:none;width:0;height:0;
  border-left:5px solid currentColor;border-top:4px solid transparent;
  border-bottom:4px solid transparent;transition:transform .15s ease}
details.disclosure[open] > summary::before{transform:rotate(90deg)}
details.disclosure > summary:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
details.disclosure > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
details.disclosure[open] > summary{border-bottom:1px solid var(--line)}
details.disclosure > :not(summary){padding:0 16px}
details.disclosure > :not(summary):first-of-type{padding-top:12px}
details.disclosure > :last-child{padding-bottom:14px}
@media print{
  details.disclosure{break-inside:avoid}
  details.disclosure > summary::before{display:none}
  details.disclosure::details-content{content-visibility:visible}
}
.tabs{margin:16px 0}
.tabs > .tab{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
.tabs > .tab::before{content:attr(data-label);display:block;font-size:12.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
[data-sf-live] .tabs{border:1px solid var(--line);border-radius:10px;overflow:hidden}
[data-sf-live] .tabs > .tab{border:none;border-radius:0;margin:0;padding:14px 16px}
[data-sf-live] .tabs > .tab::before{display:none}
[data-sf-live] .tabs > .tab[hidden]{display:none}
[data-sf-live] .sf-tablist{display:flex;flex-wrap:wrap;gap:2px;padding:4px 4px 0;
  background:var(--panel2);border-bottom:1px solid var(--line)}
[data-sf-live] .sf-tab{appearance:none;background:none;border:none;cursor:pointer;
  font:600 13px inherit;color:var(--muted);padding:8px 14px;border-radius:8px 8px 0 0;
  border-bottom:2px solid transparent}
[data-sf-live] .sf-tab:hover{color:var(--ink);background:color-mix(in srgb,var(--accent) 7%,transparent)}
[data-sf-live] .sf-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
[data-sf-live] .sf-tab.sf-selected{color:var(--accent);background:var(--panel);
  border-bottom-color:var(--accent)}
@media print{
  [data-sf-live] .sf-tablist{display:none}
  [data-sf-live] .tabs > .tab[hidden]{display:block}
  [data-sf-live] .tabs > .tab::before{display:block}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.grid .card{margin:0}
.steps{list-style:none;counter-reset:sfstep;padding-left:0;margin:14px 0}
.steps > li{counter-increment:sfstep;position:relative;padding-left:34px;margin:10px 0}
.steps > li::before{content:counter(sfstep);position:absolute;left:0;top:1px;
  width:22px;height:22px;border-radius:50%;
  background:color-mix(in srgb,var(--accent) 14%,var(--panel2));
  border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));
  color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.checklist{list-style:none;padding-left:0;margin:14px 0}
.checklist > li{position:relative;padding-left:26px;margin:7px 0}
.checklist > li::before{content:"\25a1";position:absolute;left:2px;color:var(--muted);font-size:15px;line-height:1.3}
.checklist > li.ok::before{content:"\2611";color:var(--green)}
figure{margin:18px 0}
figure svg{max-width:100%;height:auto;display:block}
figcaption{color:var(--muted);font-size:12.5px;margin-top:6px}
.flow{margin:18px 0}
.flow svg{max-width:100%;height:auto}
.svg-box{fill:var(--panel);stroke:var(--line);stroke-width:1}
.svg-box-a{fill:var(--panel);stroke:var(--accent);stroke-width:1.5}
.svg-lbl{fill:var(--ink);font-size:12px;font-weight:600}
.svg-lbl-m{fill:var(--muted);font-size:11px}
.svg-arrow{stroke:var(--muted);stroke-width:1.4;fill:none}
/* spec */
ol.sf-stages{list-style:none;padding-left:0}
li[data-sf-stage]{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
li[data-sf-stage]>.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
li[data-sf-stage]>.sh h3{margin:0;font-size:15.5px}
ul.sf-tasks{list-style:none;padding-left:4px;margin:10px 0 2px}
li[data-sf-task]{margin:6px 0;font-size:14px}
li[data-sf-task] .verify{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 0 20px}
.evidence{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:0 10px 10px 0;padding:11px 14px;margin:14px 0}
.evidence .val{font-size:19px;font-weight:700;line-height:1.3;color:var(--accent)}
.evidence .meta{color:var(--muted);font-size:12px;margin-top:3px}

/* specforge:components end sha=bcf43c74 */

  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --ink:#e6e8ee; --muted:#9aa3b2;
    --line:#2a2f3a; --accent:#6ea8fe; --green:#3fb950; --amber:#d29922; --red:#f85149;
    --code:#11151c; --shadow:0 1px 0 rgba(255,255,255,.02), 0 8px 24px rgba(0,0,0,.28);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#fbfaf7; --panel:#ffffff; --panel2:#f5f3ee; --ink:#222629; --muted:#5f6873;
    --line:#e4e0d7; --accent:#2563eb; --green:#15803d; --amber:#b45309; --red:#b91c1c;
    --code:#f1efe9; --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#fbfaf7; --panel:#ffffff; --panel2:#f5f3ee; --ink:#222629; --muted:#5f6873;
      --line:#e4e0d7; --accent:#2563eb; --green:#15803d; --amber:#b45309; --red:#b91c1c;
      --code:#f1efe9; --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  code,kbd{font-family:var(--mono);font-size:.88em;background:var(--code);
    border:1px solid var(--line);border-radius:5px;padding:.08em .38em}
  pre{background:var(--code);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.55}
  pre code{background:none;border:none;padding:0}

  .layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:0;max-width:var(--maxw,1280px);margin:0 auto}
  /* Floating left TOC: pinned to the top of the viewport, scrolls independently,
     stays in view for the whole page scroll (never scrolls up with the content). */
  nav.toc{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;z-index:5;
    padding:28px 16px 60px 24px;border-right:1px solid var(--line);font-size:13.5px}
  nav.toc .brand{font-weight:700;font-size:15px;letter-spacing:.2px;margin-bottom:4px}
  nav.toc .brand span{color:var(--accent)}
  nav.toc .tag-mini{color:var(--muted);font-size:11.5px;margin-bottom:18px;display:block}
  nav.toc a{display:block;color:var(--muted);padding:4px 8px;border-radius:6px;border-left:2px solid transparent}
  nav.toc a:hover{color:var(--ink);text-decoration:none;background:var(--panel)}
  nav.toc a.active{color:var(--ink);border-left-color:var(--accent);background:var(--panel)}
  /* On narrow viewports the sticky sidebar would crowd the content — collapse it
     to a static strip above the body so nothing overlaps. */
  @media (max-width:860px){
    .layout{grid-template-columns:1fr}
    nav.toc{position:static;max-height:none;overflow:visible;
      border-right:none;border-bottom:1px solid var(--line)}
  }

  main{padding:40px 48px 120px;min-width:0}
  /* h1 only. h2 to h5, the table and the definition list are library components
     and are styled in the stamped block above. A copy here would sit after that
     block and win, which is what silently happened to the whole heading family. */
  h1{font-size:30px;line-height:1.25;margin:0 0 10px}
  p{margin:10px 0}
  ul,ol{margin:10px 0;padding-left:22px}
  li{margin:5px 0}
  .sub{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="layout">

<nav class="toc">
  <div class="brand"><span>Spec</span>Forge</div>
  <span class="tag-mini">{{STATUS}}</span>
  <a href="#tldr">TL;DR</a>
  <!-- One link per section you add, in document order, pointing at its id. -->
</nav>

<main>
  <h1>{{TITLE}}</h1>
  <p class="sub">Spec · {{DATE}} · status: <span class="tag accent">{{STATUS}}</span> · owner: {{OWNER}}</p>

  <section id="tldr" data-sf-section>
    <div class="panel">
      <h4 style="margin-top:0">TL;DR</h4>
      <p style="margin-bottom:0">{{ Three-to-five lines: what this document is and what it concludes or proposes. }}</p>
    </div>
  </section>

  <!--
    This is the general shell: the SpecForge scaffold with no opinion about
    sections. Use it when no other type fits (design, research, design-impl,
    impl, deck), including when the source is a markdown file whose headings
    are its own.

    Add sections here. Each one is a section element carrying a stable kebab-case
    id and the data-sf-section attribute, opening with an h2 whose text matches
    its TOC link, then content in p / ul / table / .panel / .card / .callout.
    Copy the shape from the tldr section above, and add one TOC link per section
    in the same order.

    (No example markup in this comment on purpose: the store parses specs with
    regexes that do not skip comments, so a sample section element here would be
    counted as a real one.)

    Rules that still apply, because they are the house contract and the lint:
      - ids are unique and stable; comments anchor to them.
      - every section carries data-sf-section.
      - color only through the palette tokens defined above.
      - the theme block, the TOC, and the scroll-spy script stay.
    If the document grows stages and tasks, add a section with the id impl-plan
    using the data-sf-stage / data-sf-task / data-sf-status markup, and one with
    the id task-tracker; the tracker renders itself from the plan.
  -->

  <p class="footnote" style="margin-top:40px">Authored with SpecForge · {{DATE}}</p>
</main>
</div>

<script>
  // TOC scroll-spy.
  (function(){
    var links=[].slice.call(document.querySelectorAll("nav.toc a"));
    var map={};links.forEach(function(a){map[a.getAttribute("href").slice(1)]=a;});
    var obs=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(l){l.classList.remove("active");});
          var a=map[e.target.id];if(a)a.classList.add("active");
        }
      });
    },{rootMargin:"-10% 0px -80% 0px",threshold:0});
    Object.keys(map).forEach(function(id){var el=document.getElementById(id);if(el)obs.observe(el);});
  })();
</script>
</body>
